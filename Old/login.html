<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title data-blk-text="t1"></title>
  <meta name="description" content="Convierte tu conocimiento en soluciones con Tektonik hub: crea micro-apps con IA, automatiza tareas y comparte herramientas con tu equipo como citizen developer.">
  <meta name="theme-color" content="#111111">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,800;1,900&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg:           #EFEFEB;
      --bg-2:         #E4E4DF;
      --card:         #FFFFFF;
      --fg:           #111111;
      --fg-soft:      #444444;
      --muted:        #777777;
      --line:         #E2E2DE;
      --accent:       #FEFF44;
      --accent-on:    #111111;
      --green:        #0B7A48;
      --green-bg:     #E8F5EE;
      --amber:        #B45309;
      --amber-bg:     #FEF3C7;
      --red:          #B91C1C;
      --red-bg:       #FEE2E2;
      --blue:         #1D4ED8;
      --blue-bg:      #EFF6FF;

      --display-font: 'Barlow', system-ui, -apple-system, sans-serif;
      --body-font:    'DM Sans', system-ui, -apple-system, sans-serif;
      --mono-font:    'JetBrains Mono', monospace;

      --r-card:       16px;
      --r-sm:         8px;
      --shadow:       0 8px 24px -10px rgba(0,0,0,.08);
      --shadow-lg:    0 24px 50px -20px rgba(0,0,0,.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--body-font);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: var(--body-font); cursor: pointer; border: none; background: transparent; }

    .ico {
      width: 16px; height: 16px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ── Top Bar ── */
    .top-bar {
      height: 60px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 20;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px; height: 32px;
      background: #111;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-weight: 900;
      font-size: 14px;
      color: var(--accent);
    }

    .brand-title {
      font-family: var(--display-font);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .badge-sso {
      background: #111;
      color: var(--accent);
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: .04em;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      background: #fff;
    }

    .lang-btn {
      font-family: var(--mono-font);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--muted);
      transition: all .15s ease;
    }
    .lang-btn.active {
      background: #111;
      color: #fff;
    }

    .btn-hub-link {
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s ease;
    }
    .btn-hub-link:hover { border-color: #111; }

    /* ── Split Layout Container ── */
    .login-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      min-height: calc(100vh - 60px);
    }

    @media (max-width: 980px) {
      .login-wrapper {
        grid-template-columns: 1fr;
      }
      .brand-side { display: none; }
    }

    /* ── Left Side: Brand & Trust ── */
    .brand-side {
      background: #111;
      color: #fff;
      padding: 50px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .brand-side::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(254,255,68,0.12) 0%, transparent 45%),
        repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,.02) 8px 9px);
      pointer-events: none;
    }

    .brand-side-content {
      position: relative;
      z-index: 2;
    }

    .org-pill-active {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono-font);
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(254,255,68,0.12);
      border: 1px solid rgba(254,255,68,0.3);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .brand-side h1 {
      font-family: var(--display-font);
      font-size: clamp(34px, 4vw, 52px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -.02em;
      margin-bottom: 16px;
    }
    .brand-side h1 span { color: var(--accent); }

    .brand-side p {
      font-size: 16px;
      color: #aaa;
      max-width: 480px;
      line-height: 1.55;
      margin-bottom: 32px;
    }

    /* Security Radar Card */
    .trust-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px 24px;
      max-width: 520px;
      backdrop-filter: blur(10px);
      margin-bottom: 28px;
    }

    .trust-title {
      font-family: var(--mono-font);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trust-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .trust-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13.5px;
      color: #ddd;
    }
    .trust-item svg {
      width: 15px; height: 15px;
      color: var(--accent);
      margin-top: 3px;
      flex-shrink: 0;
    }

    .brand-side-footer {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      color: #777;
    }

    .badge-compliance {
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 700;
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* ── Right Side: Auth Forms ── */
    .auth-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 30px;
      background: var(--bg);
      overflow-y: auto;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }

    .auth-header {
      margin-bottom: 24px;
    }

    .auth-header h2 {
      font-family: var(--display-font);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15;
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Demo Quick Role Switcher */
    .demo-roles-banner {
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 22px;
    }

    .demo-roles-title {
      font-family: var(--mono-font);
      font-size: 10.5px;
      font-weight: 800;
      color: var(--fg);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .role-quick-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--fg);
      text-align: left;
      cursor: pointer;
      transition: all .15s ease;
    }
    .role-quick-btn:hover {
      border-color: #111;
      background: #fafaf8;
    }

    .role-quick-btn .role-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-super   { background: #111; }
    .dot-admin   { background: var(--amber); }
    .dot-dev     { background: #10B981; }
    .dot-catalog { background: var(--blue); }

    /* Tabs: SSO vs Credentials */
    .auth-tabs {
      display: flex;
      border-bottom: 1.5px solid var(--line);
      margin-bottom: 20px;
      gap: 16px;
    }

    .auth-tab-btn {
      padding: 8px 4px 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all .15s ease;
    }
    .auth-tab-btn:hover { color: var(--fg); }
    .auth-tab-btn.active {
      color: var(--fg);
      border-bottom-color: var(--fg);
    }

    /* SSO Section */
    .sso-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-sso {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .btn-sso-primary {
      background: #111;
      color: #fff;
    }
    .btn-sso-primary:hover {
      background: #000;
      transform: translateY(-1px);
    }

    .btn-sso-secondary {
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--fg);
    }
    .btn-sso-secondary:hover {
      border-color: #111;
      background: var(--bg);
    }

    .divider-or {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--muted);
      font-family: var(--mono-font);
      font-size: 11px;
      margin: 18px 0;
    }
    .divider-or::before, .divider-or::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--line);
    }
    .divider-or:not(:empty)::before { margin-right: .8em; }
    .divider-or:not(:empty)::after  { margin-left: .8em; }

    /* Form Fields */
    .field-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field-label a {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .field-label a:hover { color: #111; text-decoration: underline; }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-family: var(--body-font);
      font-size: 14px;
      color: var(--fg);
      background: #fff;
      outline: none;
      transition: all .15s ease;
    }
    .form-input:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(17,17,17,.06);
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .pwd-toggle-btn:hover { color: var(--fg); }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--fg-soft);
      cursor: pointer;
      user-select: none;
      margin-bottom: 20px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      background: var(--fg);
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all .15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover {
      background: #000;
    }

    /* ── 2FA Modal Step Simulator ── */
    .mfa-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
    }
    .mfa-overlay.open { display: grid; }

    .mfa-card {
      background: #fff;
      border: 2px solid var(--fg);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 30px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .mfa-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--accent);
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
    }
    .mfa-icon svg { width: 26px; height: 26px; stroke: #111; }

    .mfa-card h3 {
      font-family: var(--display-font);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .mfa-card p {
      font-size: 13.5px;
      color: var(--fg-soft);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .otp-field {
      width: 46px;
      height: 52px;
      text-align: center;
      font-family: var(--mono-font);
      font-size: 20px;
      font-weight: 800;
      border: 2px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    .otp-field:focus { border-color: #111; }

    .mfa-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Handshake Animation Overlay ── */
    .handshake-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .handshake-overlay.open { display: flex; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid var(--line);
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .handshake-status {
      font-family: var(--mono-font);
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(12px);
      transition: all .2s ease;
      z-index: 300;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-left">
      <div class="brand-logo"><!--blk:text:t2--></div>
      <span class="brand-title"><!--blk:text:t3--></span>
      <span class="badge-sso"><!--blk:text:t4--><!--blk:text:t5--><!--blk:text:t6--></span>
    </div>

    <div class="top-right">
      <div class="lang-switcher">
        <button class="lang-btn active" id="lang-es" onclick="setLang('es')"><!--blk:text:t7--></button>
        <button class="lang-btn" id="lang-en" onclick="setLang('en')"><!--blk:text:t8--></button>
      </div>
      <a href="index.html" class="btn-hub-link">
        <svg class="ico" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        <span id="txt-back-hub"><!--blk:text:t9--></span>
      </a>
    </div>
  </header>

  <!-- Login Main Wrapper (Split Screen) -->
  <div class="login-wrapper">

    <!-- Left: Trust & Enterprise Brand -->
    <section class="brand-side">
      <div class="brand-side-content">
        <div class="org-pill-active">
          <svg class="ico" style="width:13px;height:13px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><!--blk:text:t10--></div>

        <h1><!--blk:text:t11--><span><!--blk:text:t12--></span><!--blk:text:t13--></h1>
        <p><!--blk:text:t14--></p>

        <div class="trust-card">
          <div class="trust-title">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><!--blk:text:t15--></div>
          <div class="trust-list">
            <div class="trust-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              <span><b><!--blk:text:t16--><!--blk:text:t17--><!--blk:text:t18--></b><!--blk:text:t19--></span>
            </div>
            <div class="trust-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              <span><b><!--blk:text:t20--></b><!--blk:text:t21--></span>
            </div>
            <div class="trust-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              <span><b><!--blk:text:t22--></b><!--blk:text:t23--></span>
            </div>
          </div>
        </div>
      </div>

      <div class="brand-side-footer">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge-compliance"><!--blk:text:t24--></span>
          <span class="badge-compliance"><!--blk:text:t25--></span>
          <span class="badge-compliance"><!--blk:text:t26--></span>
        </div>
        <div style="font-family:var(--mono-font);color:#0b7a48;font-weight:700">
          <!--blk:text:t27--><!--blk:text:t28--></div>
      </div>
    </section>

    <!-- Right: Authentication Card -->
    <main class="auth-side">
      <div class="auth-card">

        <div class="auth-header">
          <h2 id="lbl-login-title"><!--blk:text:t29--></h2>
          <p id="lbl-login-desc"><!--blk:text:t30--></p>
        </div>

        <!-- Acceso Rápido Demo Roles -->
        <div class="demo-roles-banner">
          <div class="demo-roles-title">
            <svg class="ico" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><!--blk:text:t31--></div>
          <div class="demo-roles-grid">
            <button class="role-quick-btn" onclick="quickLogin('superadmin')">
              <span class="role-dot dot-super"></span><!--blk:text:t32--></button>
            <button class="role-quick-btn" onclick="quickLogin('admin')">
              <span class="role-dot dot-admin"></span><!--blk:text:t33--></button>
            <button class="role-quick-btn" onclick="quickLogin('developer')">
              <span class="role-dot dot-dev"></span><!--blk:text:t34--></button>
            <button class="role-quick-btn" onclick="quickLogin('catalog')">
              <span class="role-dot dot-catalog"></span><!--blk:text:t35--></button>
          </div>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab-btn active" id="tab-sso" onclick="switchAuthTab('sso')"><!--blk:text:t36--></button>
          <button class="auth-tab-btn" id="tab-manual" onclick="switchAuthTab('manual')"><!--blk:text:t37--></button>
        </div>

        <!-- Panel SSO -->
        <div id="panel-sso">
          <div class="sso-buttons">
            <button class="btn-sso btn-sso-primary" onclick="startSsoFlow('Okta')">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><!--blk:text:t38--></button>
            <button class="btn-sso btn-sso-secondary" onclick="startSsoFlow('Microsoft Entra')">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/></svg><!--blk:text:t39--></button>
          </div>
          <p style="font-size:12px;color:var(--muted);text-align:center"><!--blk:text:t40--></p>
        </div>

        <!-- Panel Manual Credentials -->
        <div id="panel-manual" style="display:none">
          <form onsubmit="handleManualSubmit(event)">
            <div class="field-group">
              <div class="field-label">
                <label for="emp-email"><!--blk:text:t41--></label>
              </div>
              <input type="email" id="emp-email" class="form-input" data-blk-placeholder="a42" required data-blk-value="a43">
            </div>

            <div class="field-group">
              <div class="field-label">
                <label for="emp-pwd"><!--blk:text:t44--></label>
                <a href="#" onclick="showToast('Contacta con helpdesk@viarapida.internal para resetear contraseña')"><!--blk:text:t45--></a>
              </div>
              <div class="input-wrapper">
                <input type="password" id="emp-pwd" class="form-input" data-blk-placeholder="a46">
                <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()">
                  <svg class="ico" id="pwd-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <label class="checkbox-row">
              <input type="checkbox" checked>
              <span><!--blk:text:t47--></span>
            </label>

            <button type="submit" class="btn-submit">
              <span><!--blk:text:t48--></span>
              <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
          </form>
        </div>

      </div>
    </main>

  </div>

  <!-- Modal 2FA / Okta Verify Simulation -->
  <div class="mfa-overlay" id="mfa-modal">
    <div class="mfa-card">
      <div class="mfa-icon">
        <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </div>
      <h3><!--blk:text:t49--></h3>
      <p><!--blk:text:t50--><b><!--blk:text:t51--></b><!--blk:text:t52--></p>

      <div class="otp-inputs">
        <input type="text" maxlength="1" class="otp-field" data-blk-value="a53" oninput="moveOtp(this, 1)">
        <input type="text" maxlength="1" class="otp-field" data-blk-value="a54" oninput="moveOtp(this, 2)">
        <input type="text" maxlength="1" class="otp-field" data-blk-value="a55" oninput="moveOtp(this, 3)">
        <input type="text" maxlength="1" class="otp-field" data-blk-value="a56" oninput="moveOtp(this, 4)">
        <input type="text" maxlength="1" class="otp-field" data-blk-value="a57" oninput="moveOtp(this, 5)">
        <input type="text" maxlength="1" class="otp-field" data-blk-value="a58" oninput="finishOtp()">
      </div>

      <div class="mfa-actions">
        <button class="btn-submit" onclick="finishOtp()"><!--blk:text:t59--></button>
        <button class="btn-hub-link" style="justify-content:center" onclick="closeMfa()"><!--blk:text:t60--></button>
      </div>
    </div>
  </div>

  <!-- Handshake Loading Overlay -->
  <div class="handshake-overlay" id="handshake">
    <div class="spinner"></div>
    <h3 style="font-family:var(--display-font);font-size:22px;font-weight:800" id="hs-title"><!--blk:text:t61--></h3>
    <div class="handshake-status" id="hs-sub"><!--blk:text:t62--></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="assets/js/data-store.js"></script>
  <script>
    window.BLK.ready.then(() => {
    let currentAuthMode = 'sso';
    let targetDestination = 'app-catalog.html';

    /* ── Cambiar Tabs ── */
    function switchAuthTab(mode) {
      currentAuthMode = mode;
      document.getElementById('tab-sso').classList.toggle('active', mode === 'sso');
      document.getElementById('tab-manual').classList.toggle('active', mode === 'manual');
      document.getElementById('panel-sso').style.display = mode === 'sso' ? 'block' : 'none';
      document.getElementById('panel-manual').style.display = mode === 'manual' ? 'block' : 'none';
    }

    /* ── Mostrar / Ocultar Password ── */
    function togglePasswordVisibility() {
      const input = document.getElementById('emp-pwd');
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      document.getElementById('pwd-icon').innerHTML = isPwd
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }

    /* ── Acceso Rápido por Rol ── */
    function quickLogin(role) {
      try {
        const user = BLK.setRole(role);
        targetDestination = BLK.content('login').destinations[role];
        runHandshake(user.name, 'Identidad local de demostración. Sin autenticación real.', targetDestination);
      } catch (error) { showToast(error.message); }
    }

    /* ── Flujo SSO ── */
    function startSsoFlow(provider) {
      targetDestination = 'app-catalog.html';
      document.getElementById('mfa-modal').classList.add('open');
    }

    function closeMfa() {
      document.getElementById('mfa-modal').classList.remove('open');
    }

    function moveOtp(input, nextIdx) {
      if (input.value.length === 1) {
        const fields = document.querySelectorAll('.otp-field');
        if (fields[nextIdx]) fields[nextIdx].focus();
      }
    }

    function finishOtp() {
      closeMfa();
      quickLogin('catalog');
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      document.getElementById('emp-pwd').value = '';
      quickLogin('catalog');
    }

    /* ── Simulación de Handshake Seguro ── */
    function runHandshake(userLabel, subLabel, dest) {
      const hs = document.getElementById('handshake');
      const title = document.getElementById('hs-title');
      const sub = document.getElementById('hs-sub');

      title.textContent = `Seleccionando identidad DEMO: ${userLabel}...`;
      sub.textContent = subLabel;
      hs.classList.add('open');

      setTimeout(() => {
        sub.textContent = 'Simulación: no se verifica SSO, DLP ni certificados.';
      }, 700);

      setTimeout(() => {
        sub.textContent = 'Rol de demo seleccionado. Abriendo la pantalla...';
      }, 1400);

      setTimeout(() => {
        window.location.href = dest;
      }, 2000);
    }

    /* ── Toast ── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    /* ── Idioma ── */
    function setLang(lang) {
      document.getElementById('lang-es').classList.toggle('active', lang === 'es');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      const labels = BLK.content('login').i18n[lang] || BLK.content('login').i18n.es;
      document.getElementById('lbl-login-title').textContent = labels.title;
      document.getElementById('lbl-login-desc').textContent = labels.description;
      document.getElementById('txt-back-hub').textContent = labels.back;
      showToast(lang === 'en' ? 'Demo language: English' : 'Idioma de demo: Español');
    }

    /* ── Inyección Dinámica de Estilos Guardados en admin.html ── */


    Object.assign(window, { switchAuthTab, togglePasswordVisibility, quickLogin, startSsoFlow, closeMfa, moveOtp, finishOtp, handleManualSubmit, runHandshake, showToast, setLang });
    }).catch(window.BLK.showError);
  </script>

</body>
</html>
