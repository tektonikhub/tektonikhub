<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title id="meta-title"></title>
  <meta name="description" id="meta-desc"
    content="">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tektonik hub">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-desc"
    content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111111">

  <!-- Tipografías de alta gama -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,800;1,900&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #EFEFEB;
      --bg-2: #E4E4DF;
      --card: #FFFFFF;
      --fg: #111111;
      --fg-soft: #444444;
      --muted: #777777;
      --line: #E2E2DE;
      --accent: #FEFF44;
      --accent-on: #111111;
      --display-font: 'Barlow', system-ui, -apple-system, sans-serif;
      --body-font: 'DM Sans', system-ui, -apple-system, sans-serif;
      --mono-font: 'JetBrains Mono', monospace;
      --r-card: 18px;
      --r-tile: 14px;
      --wrap: 1100px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--body-font);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img,
    svg {
      display: block;
    }

    .wrap {
      width: 100%;
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 0 24px;
    }

    .ico {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    /* ── Barra Superior Flotante ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: saturate(160%) blur(14px);
      -webkit-backdrop-filter: saturate(160%) blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .top-bar .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      gap: 16px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--fg);
      transition: all .15s ease;
    }

    .back-btn:hover {
      background: #fff;
      border-color: #111;
    }

    .org-badge {
      background: #111;
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: #fff;
    }

    .lang-switch button {
      border: none;
      background: transparent;
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s ease;
      font-size: 11px;
    }

    .lang-switch button[aria-current="page"] {
      background: var(--fg);
      color: #fff;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 10px;
      background: #fff;
      border: 1.5px solid var(--line);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s ease;
    }

    .btn-share:hover {
      border-color: #111;
    }

    .btn-dark-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease;
    }

    .btn-dark-link:hover {
      background: #000;
    }

    /* ── Hero de la Organización ── */
    .org-card {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 24px;
      margin-top: 24px;
      overflow: hidden;
      box-shadow: 0 16px 36px -20px rgba(0, 0, 0, .08);
    }

    .org-cover {
      height: 180px;
      background-color: #111;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(254, 255, 68, 0.18) 0%, transparent 40%),
        linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 18px 24px;
    }

    .cover-tag {
      font-family: var(--mono-font);
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.7);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      letter-spacing: .04em;
    }

    .org-body {
      padding: 0 28px 28px;
      position: relative;
    }

    .org-header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 0;
      margin-bottom: 20px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .org-avatar-wrap {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      min-width: 0;
      max-width: 100%;
    }

    .org-avatar {
      margin-top: -46px;
      width: 92px;
      height: 92px;
      border-radius: 20px;
      background: #111;
      border: 4.5px solid #fff;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, .3);
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-weight: 900;
      font-size: 32px;
      color: var(--accent);
      flex-shrink: 0;
      position: relative;
    }

    .org-title-area {
      min-width: 0;
      padding-top: 14px;
      overflow-wrap: anywhere;
    }

    .org-title-area h1 {
      font-family: var(--display-font);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .org-subtitle {
      font-family: var(--mono-font);
      font-size: 13.5px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 4px;
    }

    .org-stats-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 20px;
      margin-top: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-num {
      font-family: var(--display-font);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--fg);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    @media (max-width: 760px) {
      .org-stats-bar {
        gap: 14px;
      }
    }

    /* ── Banner de IT como Facilitador ── */
    .it-banner {
      background: #111;
      color: #fff;
      border-radius: 18px;
      padding: 24px 28px;
      margin: 32px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .it-banner-title {
      font-family: var(--display-font);
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .it-banner-p {
      font-size: 14px;
      color: #ccc;
      max-width: 680px;
      line-height: 1.5;
    }

    /* ── Directorio de Citizen Developers Destacados ── */
    .creators-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 40px;
    }

    @media (max-width: 900px) {
      .creators-grid {
        grid-template-columns: 1fr;
      }
    }

    .creator-card-mini {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all .15s ease;
    }

    .creator-card-mini:hover {
      border-color: #111;
      transform: translateY(-2px);
    }

    .creator-mini-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .c-avatar-mini {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-weight: 800;
      font-size: 20px;
      color: #111;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .1);
      flex-shrink: 0;
    }

    /* ── Filtros y Categorías ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin: 32px 0 20px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .filter-btn {
      background: #fff;
      border: 1px solid var(--line);
      font-family: var(--body-font);
      font-size: 13.5px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s ease;
    }

    .filter-btn:hover {
      border-color: #111;
    }

    .filter-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    /* ── Grid de Herramientas de la Organización ── */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 60px;
    }

    @media (max-width: 960px) {
      .apps-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .apps-grid {
        grid-template-columns: 1fr;
      }
    }

    .app-card {
      background: #fff;
      border: 1.5px solid var(--fg);
      border-radius: var(--r-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px -20px rgba(0, 0, 0, .12);
      transition: transform .2s ease;
    }

    .app-card:hover {
      transform: translateY(-4px);
    }

    .app-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .app-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-family: var(--mono-font);
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 700;
    }

    .app-title {
      font-family: var(--display-font);
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .app-desc {
      font-size: 13.5px;
      color: var(--fg-soft);
      line-height: 1.45;
      margin-bottom: 16px;
      flex: 1;
    }

    /* ── Footer ── */
    footer {
      padding: 36px 0;
      border-top: 1px solid var(--line);
      background: #fff;
      margin-top: 60px;
    }

    footer .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transform: translateY(12px);
      transition: all .25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    [hidden] { display: none !important; }
    .company-actions, .company-toolbar, .company-form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .company-actions button, .company-toolbar button, #company-dialog button {
      font-family: var(--body-font); font-weight: 700; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); color: var(--fg); cursor: pointer;
    }
    button.company-primary { background: var(--accent) !important; color: var(--accent-on, #111) !important; }
    button.company-danger { color: var(--red, #B91C1C); }
    .company-toolbar input, .company-toolbar select { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); font-family: var(--body-font); max-width: 100%; }
    #company-dialog { width: min(560px, calc(100% - 24px)); max-height: calc(100% - 32px); margin: auto; padding: 24px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--card); color: var(--fg); }
    #company-dialog::backdrop { background: rgba(0,0,0,.45); }
    .company-form-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .company-form-heading h2 { font-family: var(--display-font); font-size: 24px; }
    #company-fields label { display: grid; gap: 6px; margin-top: 14px; font-size: 13px; font-weight: 700; }
    #company-fields input, #company-fields select, #company-fields textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-2); color: var(--fg); font-family: var(--body-font); }
    #company-fields textarea { min-height: 90px; resize: vertical; }
    #company-form-error { color: var(--red, #B91C1C); margin-top: 12px; }
    .company-note { font-size: 12px; color: var(--muted); margin: 8px 0; }
  </style>
</head>

<body>

  <!-- ── BARRA SUPERIOR ── -->
  <div class="top-bar">
    <div class="wrap">
      <div class="top-left">
        <a class="back-btn" href="index.html">
          <svg class="ico" viewBox="0 0 24 24">
            <path d="M19 12H5" />
            <path d="m12 19-7-7 7-7" />
          </svg>
          <span data-i18n="backHub"></span>
        </a>
        <div
          style="font-family:var(--mono-font);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px">
          <span>/</span>
          <span class="org-badge"><span data-content="blocks.top-bar.org-badge1"></span></span>
          <b style="color:var(--fg)" data-org-field="name"></b>
        </div>
      </div>
      <div class="top-actions">
        <nav class="lang-switch" aria-label="Idioma">
          <button type="button" data-set-lang="en">EN</button>
          <button type="button" data-set-lang="es" aria-current="page">ES</button>
        </nav>
        <a class="btn-dark-link" href="profile.html">
          <svg class="ico" viewBox="0 0 24 24">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span data-i18n="leadProfile"></span>
        </a>
      </div>
    </div>
  </div>

  <main class="wrap">
    <!-- ── CABECERA DE LA ORGANIZACIÓN ── -->
    <section class="org-card">
      <div class="org-cover">
        <div style="font-family:var(--mono-font);font-size:11px;color:#fff;font-weight:700">

        </div>
        <div class="cover-tag"> </div>
      </div>
      <div class="org-body">
        <div class="org-header-row">
          <div class="org-avatar-wrap">
            <div class="org-avatar" data-org-field="initials"></div>
            <div class="org-title-area">
              <h1>
                <span data-org-field="name"></span>
                <span
                  style="font-size:12px;background:#111;color:var(--accent);padding:4px 8px;border-radius:6px;font-family:var(--mono-font)"><span data-content="blocks.org-card.span1"></span></span>
              </h1>
              <div class="org-subtitle">
              </div>
            </div>
          </div>
          <div style="display:flex;gap:10px">
            <button class="btn-share" onclick="shareOrganization()">
              <svg class="ico" viewBox="0 0 24 24">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
              </svg>
              <span data-i18n="shareOrg"></span>
            </button>
          </div>
        </div>

        <p style="font-size:15.5px;color:var(--fg-soft);max-width:840px;line-height:1.55" data-i18n="orgBio"></p>

        <div class="org-stats-bar">
          <div class="stat-box">
            <span class="stat-num"></span>
            <span class="stat-label" data-i18n="statApps"></span>
          </div>
          <div class="stat-box">
            <span class="stat-num"></span>
            <span class="stat-label" data-i18n="statUsers"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ── BANNER IT COMO FACILITADOR ── -->
    <section class="it-banner">
      <div>
        <div class="it-banner-title" data-i18n="itBannerTitle"></div>
        <p class="it-banner-p" data-i18n="itBannerDesc"></p>
      </div>
      <a class="back-btn" href="index.html#governance"
        style="background:var(--accent);color:#111;border-color:transparent;font-weight:800" data-i18n="itGovLink"></a>
    </section>

    <!-- ── CITIZEN DEVELOPERS DESTACADOS ── -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin:32px 0 16px">
      <div>
        <h2 style="font-family:var(--display-font);font-size:24px;font-weight:800" data-i18n="topDevsTitle"></h2>
        <p style="font-size:13.5px;color:var(--muted)" data-i18n="topDevsSubtitle"></p>
      </div>
    </div>

    <div class="creators-grid"></div>
<template id="company-creator-template"><article class="creator-card-mini"><div><div class="creator-mini-top"><div class="c-avatar-mini"></div><div><div data-creator-name style="font-weight:800;font-size:16px"></div><div data-creator-dept style="font-family:var(--mono-font);font-size:11.5px;color:var(--muted)"></div></div></div><p style="font-size:13px;color:var(--fg-soft);line-height:1.45;margin-bottom:12px"></p></div><a class="back-btn" href="profile.html" style="justify-content:center;font-size:12.5px"></a></article></template>

    <!-- ── CATÁLOGO DE APLICACIONES DEPARTAMENTALES ── -->
    <div
      style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-family:var(--display-font);font-size:26px;font-weight:800" data-i18n="catTitle"></h2>
        <p style="font-size:14px;color:var(--muted)" data-i18n="catSubtitle"></p>
      </div>
    </div>

    <div class="apps-grid"></div>
<template id="company-app-template"><article class="app-card"><div class="app-body"><div class="app-meta-row"><span></span><span style="color:#0b7a48"></span></div><h3 class="app-title"></h3><p class="app-desc"></p><div style="display:flex;gap:8px;margin-top:auto"><a class="btn-dark-link" href="profile.html" style="flex:1;justify-content:center;font-size:12px"></a></div></div></article></template>
  </main>

  <!-- ── FOOTER ── -->
  <footer>
    <div class="wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <b style="font-family:var(--display-font);font-size:18px;text-transform:uppercase">Tektonik hub</b>
        <span></span>
      </div>
      <nav style="display:flex;gap:18px">
        <a href="index.html" data-i18n="footHome"></a>
        <a href="profile.html" data-i18n="footHugo"></a>
        <a href="index.html#governance" data-i18n="footGov"></a>
        <a href="index.html#pricing" data-i18n="footPricing"></a>
      </nav>
      <span style="font-family:var(--mono-font)"></span>
    </div>
  </footer>

  <dialog id="company-dialog" aria-labelledby="company-dialog-title">
    <form id="company-form">
