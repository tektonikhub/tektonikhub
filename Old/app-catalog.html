<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title data-blk-text="t1"></title>
  <meta name="description" content="Catálogo centralizado de micro-apps de Via Rapida. Herramientas validadas por IT Security para todos los departamentos.">
  <meta name="theme-color" content="#111111">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,800;1,900&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg:           #EFEFEB;
      --bg-2:         #E4E4DF;
      --card:         #FFFFFF;
      --fg:           #111111;
      --fg-soft:      #444444;
      --muted:        #777777;
      --line:         #E2E2DE;
      --accent:       #FEFF44;
      --accent-on:    #111111;
      --green:        #0B7A48;
      --green-bg:     #E8F5EE;
      --amber:        #B45309;
      --amber-bg:     #FEF3C7;
      --red:          #B91C1C;
      --red-bg:       #FEE2E2;
      --blue:         #1D4ED8;
      --blue-bg:      #EFF6FF;

      --display-font: 'Barlow', system-ui, -apple-system, sans-serif;
      --body-font:    'DM Sans', system-ui, -apple-system, sans-serif;
      --mono-font:    'JetBrains Mono', monospace;

      --sidebar-w:    260px;
      --topbar-h:     60px;
      --r-card:       16px;
      --r-sm:         8px;
      --shadow:       0 8px 24px -10px rgba(0,0,0,.08);
      --shadow-lg:    0 20px 40px rgba(0,0,0,.16);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--body-font);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: var(--body-font); cursor: pointer; border: none; background: transparent; }

    .ico {
      width: 16px; height: 16px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ── Top Bar ── */
    .top-bar {
      height: var(--topbar-h);
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
      gap: 16px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 32px; height: 32px;
      background: #111;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-weight: 900;
      font-size: 14px;
      color: var(--accent);
    }

    .org-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .badge-admin {
      background: #111;
      color: var(--accent);
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: .04em;
    }

    .top-center {
      flex: 1;
      max-width: 440px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 0 12px;
      height: 38px;
      transition: all .15s ease;
    }
    .top-center:focus-within {
      border-color: #111;
      background: #fff;
    }
    .top-center input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--body-font);
      font-size: 13.5px;
      color: var(--fg);
      outline: none;
    }
    .search-key {
      font-family: var(--mono-font);
      font-size: 10px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
      padding: 2px 5px;
      border-radius: 5px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-top {
      font-family: var(--body-font);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--fg);
      background: #fff;
      border: 1.5px solid var(--line);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s ease;
    }
    .btn-top:hover { border-color: #111; }
    .btn-top.accent { background: var(--accent); color: #111; border-color: transparent; }
    .btn-top.accent:hover { background: #f3f500; }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 4px 10px 4px 5px;
      border-radius: 20px;
    }

    .user-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #111;
      color: var(--accent);
      display: grid;
      place-items: center;
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 800;
    }

    /* ── App Body & Layout ── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: #fff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 16px 10px;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-label {
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 10px 10px 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--fg-soft);
      text-align: left;
      transition: all .12s ease;
      cursor: pointer;
    }

    .nav-btn .left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .nav-btn:hover {
      background: var(--bg);
      color: var(--fg);
    }

    .nav-btn.active {
      background: #111;
      color: #fff;
    }

    .nav-badge {
      font-family: var(--mono-font);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
    }
    .nav-btn.active .nav-badge {
      background: var(--accent);
      color: #111;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted);
      padding-left: 8px;
      line-height: 1.4;
    }

    /* ── Main Workspace ── */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px 60px;
    }

    /* ── Page Header & Stats ── */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 {
      font-family: var(--display-font);
      font-size: 30px;
      font-weight: 800;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-header p {
      font-size: 14px;
      color: var(--fg-soft);
      margin-top: 4px;
      max-width: 680px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 14px 18px;
    }

    .stat-num {
      font-family: var(--display-font);
      font-size: 26px;
      font-weight: 800;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      font-family: var(--mono-font);
      margin-top: 2px;
    }

    /* ── Controls Bar: Tags + View Switcher ── */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tag-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-chip-btn {
      font-family: var(--mono-font);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--fg-soft);
      cursor: pointer;
      transition: all .15s ease;
    }
    .tag-chip-btn:hover { border-color: #111; color: var(--fg); }
    .tag-chip-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .view-toggle {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 2px;
    }

    .view-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s ease;
    }
    .view-btn:hover { color: var(--fg); }
    .view-btn.active { background: #111; color: #fff; }

    /* ── App Grid & Cards (Format aligned with admin.html) ── */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .review-card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: var(--r-card);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all .15s ease;
      cursor: pointer;
    }

    .review-card:hover {
      border-color: #111;
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .app-author {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .app-title {
      font-family: var(--display-font);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .cat-chip {
      font-family: var(--mono-font);
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--fg);
    }

    .app-desc {
      font-size: 13.5px;
      color: var(--fg-soft);
      line-height: 1.45;
      flex: 1;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 12px;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 10px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .meta-item b { font-weight: 700; }

    .chips-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .file-chip {
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 700;
      background: #fff;
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      justify-content: space-between;
    }

    .btn-act {
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: none;
      transition: all .15s ease;
    }

    .btn-approve {
      background: var(--fg);
      color: var(--accent);
    }
    .btn-approve:hover { background: #000; }

    .btn-changes {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--fg);
    }
    .btn-changes:hover { border-color: #111; }

    /* ── Empty State ── */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      background: #fff;
      border: 1.5px dashed var(--line);
      border-radius: 16px;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
    }
    .modal-overlay.open { display: grid; }

    .modal-card {
      background: #fff;
      border: 2px solid var(--fg);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--bg);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .modal-close:hover { border-color: #111; background: #fff; }

    .modal-title {
      font-family: var(--display-font);
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .modal-desc {
      font-size: 14px;
      color: var(--fg-soft);
      line-height: 1.55;
      margin: 12px 0 18px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(12px);
      transition: all .2s ease;
      z-index: 200;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

      <button class="nav-btn" data-area="proyectos" onclick="filterByArea('proyectos', this)">
        <span class="left"><span style="font-size:12px"><!--blk:text:t68--></span><!--blk:text:t69--></span>
        <span class="nav-badge" id="badge-proyectos"><!--blk:text:t70--></span>
      </button>
      <button class="nav-btn" data-area="innovacion" onclick="filterByArea('innovacion', this)">
        <span class="left"><span style="font-size:12px"><!--blk:text:t71--></span><!--blk:text:t72--><!--blk:text:t73--><!--blk:text:t74--></span>
        <span class="nav-badge" id="badge-innovacion"><!--blk:text:t75--></span>
      </button>

      <div class="nav-label" style="margin-top:8px"><!--blk:text:t76--></div>
      <button class="nav-btn" data-status="approved" onclick="filterByStatus('approved', this)">
        <span class="left"><span style="color:var(--green)"><!--blk:text:t79--></span><!--blk:text:t80--></span>
        <span class="nav-badge" id="badge-approved"><!--blk:text:t81--></span>
      </button>
      <button class="nav-btn" data-status="beta" onclick="filterByStatus('beta', this)">
        <span class="left"><span style="color:var(--amber)"><!--blk:text:t82--></span><!--blk:text:t83--></span>
        <span class="nav-badge" id="badge-beta"><!--blk:text:t84--></span>
      </button>
      <button class="nav-btn" data-status="new" onclick="filterByStatus('new', this)">
        <span class="left"><span style="color:var(--blue)"><!--blk:text:t85--></span><!--blk:text:t86--></span>
        <span class="nav-badge" id="badge-new"><!--blk:text:t87--></span>
      </button>

      <div class="sidebar-footer"><!--blk:text:t88--><br><!--blk:text:t89--></div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1><!--blk:text:t90--><span class="badge-admin" style="font-size:11px"><!--blk:text:t91--></span>
          </h1>
          <p><!--blk:text:t92--></p>
        </div>
      </div>

      <div class="stats-row" style="grid-template-columns:1fr">
        <div class="stat-card">
          <div class="stat-num" id="stat-total"><!--blk:text:t93--></div>
          <div class="stat-label"><!--blk:text:t94--></div>
        </div>
      </div>

      <!-- Controls Bar: Chips de Tags + Vista Grid/List -->
      <div class="controls-bar">
        <div class="tag-chips">
          <button class="tag-chip-btn active" onclick="filterByTag('all', this)"><!--blk:text:t103--></button>
          <button class="tag-chip-btn" onclick="filterByTag('ai', this)"><!--blk:text:t104--></button>
          <button class="tag-chip-btn" onclick="filterByTag('automation', this)"><!--blk:text:t105--></button>
          <button class="tag-chip-btn" onclick="filterByTag('analytics', this)"><!--blk:text:t106--></button>
          <button class="tag-chip-btn" onclick="filterByTag('integration', this)"><!--blk:text:t107--></button>
          <button class="tag-chip-btn" onclick="filterByTag('document', this)"><!--blk:text:t108--></button>
        </div>

        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:12.5px;color:var(--muted);font-family:var(--mono-font)" id="results-count"><!--blk:text:t109--></span>
          <div class="view-toggle">
            <button class="view-btn active" id="view-grid" onclick="setView('grid', this)" data-blk-title="a110">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
            <button class="view-btn" id="view-list" onclick="setView('list', this)" data-blk-title="a111">
              <svg class="ico" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Apps Grid / List Container -->
      <div class="apps-grid" id="apps-container"></div>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <svg class="ico" style="width:36px;height:36px;color:var(--muted);margin-bottom:10px" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <h3 style="font-family:var(--display-font);font-size:18px;font-weight:800"><!--blk:text:t112--></h3>
        <p style="font-size:13px;color:var(--muted);margin-top:4px"><!--blk:text:t113--></p>
      </div>

    </main>
  </div>

  <!-- Modal Detalle App (Mismo formato y estética que admin.html) -->
  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">
        <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="assets/js/data-store.js"></script>
  <script>
    window.BLK.ready.then(() => {
    document.querySelector('#blk-demo-controls span').textContent = BLK.content('catalog').demoLabel;
    /* ══════════════════════════════════════════
       DATA SET DE APLICACIONES (24 APPS)
    ══════════════════════════════════════════ */
    const safe = value => typeof value === "string" ? BLK.escape(value) : Array.isArray(value) ? value.map(safe) : value && typeof value === "object" ? Object.fromEntries(Object.entries(value).map(([key, val]) => [key, safe(val)])) : value;
    let APPS = BLK.catalogApps();

    /* ── State ── */
    let currentArea = 'all';
    let currentStatus = null;
    let currentTag = 'all';
    let searchQuery = '';
    let viewMode = 'grid';

    /* ── Filtrado ── */
    function getFiltered() {
      return APPS.filter(app => {
        const mArea = currentArea === 'all' || app.area === currentArea;
        const mStatus = !currentStatus || app.status === currentStatus;
        const mTag = currentTag === 'all' || app.tags.includes(currentTag);
        const q = searchQuery.toLowerCase().trim();
        const mSearch = !q || [app.title, app.areaLabel, app.desc, ...(app.tech||[]), ...(app.tags||[])].join(' ').toLowerCase().includes(q);
        return mArea && mStatus && mTag && mSearch;
      });
    }

    function filterByArea(area, el) {
      currentArea = area;
      currentStatus = null;
      document.querySelectorAll('.sidebar .nav-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function filterByStatus(status, el) {
      currentStatus = currentStatus === status ? null : status;
      currentArea = 'all';
      document.querySelectorAll('.sidebar .nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-area="all"]').classList.add('active');
      if (currentStatus) el.classList.add('active');
      render();
    }

    function filterByTag(tag, el) {
      currentTag = tag;
      document.querySelectorAll('.tag-chip-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function setView(mode, btn) {
      viewMode = mode;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    /* ── Render ── */
    function render() {
      updateBadges();
      const list = getFiltered();
      const container = document.getElementById('apps-container');
      const empty = document.getElementById('empty-state');
      const countEl = document.getElementById('results-count');

      countEl.textContent = `${list.length} app${list.length !== 1 ? 's' : ''}`;

      if (list.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'flex';
        return;
      }

      empty.style.display = 'none';
      container.className = viewMode === 'grid' ? 'apps-grid' : 'apps-list';
      container.innerHTML = list.map(app => renderCard(app)).join('');
      updateBadges();
    }

    function renderCard(app) {
      app = safe(app);
      return `
        <article class="review-card" onclick="openModal('${app.id}')">
          <div class="card-top">
            <h3 class="app-title">${app.title}</h3>
            <span class="cat-chip">${app.areaLabel}</span>
          </div>

          <p class="app-desc">${app.desc}</p>
          <div class="app-author">Creado por ${app.author.name} · ${app.author.dept}</div>

          <div class="card-actions">
            <button class="btn-act btn-changes" onclick="event.stopPropagation(); openModal('${app.id}')">
              Detalles
            </button>
            <button class="btn-act btn-approve" onclick="event.stopPropagation(); sandboxApp('${app.id}')">
              <svg class="ico" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Acceder
            </button>
          </div>
        </article>
      `;
    }

    function updateBadges() {
      const areas = ['all','finanzas','rrhh','legal','ventas','marketing','operaciones','it','atencion','compras','estrategia','proyectos','innovacion'];
      areas.forEach(a => {
        const el = document.getElementById(`badge-${a}`);
        if (el) el.textContent = a === 'all' ? APPS.length : APPS.filter(ap => ap.area === a).length;
      });
      ['approved','beta','new'].forEach(s => {
        const el = document.getElementById(`badge-${s}`);
        if (el) el.textContent = APPS.filter(ap => ap.status === s).length;
      });
    }

    /* ── Modal ── */
    function openModal(id) {
      const source = APPS.find(a => a.id === id);
      if (!source) return;
      const description = source.version === 1 ? BLK.content('catalog').appDescriptions?.[id] : undefined;
      const app = safe({ ...source, longDesc: description ?? source.longDesc });

      document.getElementById('modal-content').innerHTML = `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px">
          <div>
            <span class="cat-chip" style="font-size:11px">${app.areaLabel}</span>
            <h2 class="modal-title" style="margin-top:6px">${app.title}</h2>
            <div style="font-size:12px;color:var(--muted);font-family:var(--mono-font)">Creado por ${app.author.name} · ${app.author.dept}</div>
          </div>
        </div>

        <p class="modal-desc">${app.longDesc || app.desc}</p>

        <div class="stats-row" style="margin-bottom:16px;grid-template-columns:1fr">
          <div class="stat-card">
            <div class="stat-num" style="font-size:20px;color:var(--green)">★ ${app.metrics.rating}</div>
            <div class="stat-label">Valoración</div>
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:16px">
          <button class="btn-act btn-changes" onclick="closeModal()">Cerrar</button>
          <button class="btn-act btn-approve" onclick="sandboxApp('${app.id}'); closeModal()">
            <svg class="ico" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Acceder
          </button>
        </div>
      `;

      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    }

    /* ── Search Input ── */
    const searchInp = document.getElementById('search-input');
    searchInp.addEventListener('input', e => {
      searchQuery = e.target.value;
      render();
    });

    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        searchInp.focus();
        searchInp.select();
      }
      if (e.key === 'Escape') closeModal();
    });

    /* ── Toast ── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    /* ── CARGA DINÁMICA DE ESTILOS CSS DE EMPRESA (Consolidación con admin.html) ── */


    function sandboxApp(id) { const app = BLK.catalogApps().find(app => app.id === id); if (app) showToast('DEMO: no se ejecuta ni despliega código. ' + app.title); }
    function refreshCatalog() {
      APPS = BLK.catalogApps();
      document.getElementById('stat-total').textContent = APPS.length;
      closeModal(); render();
    }
    BLK.subscribe(refreshCatalog);
    refreshCatalog();
    const linkedAppId = new URLSearchParams(location.search).get('app');
    if (linkedAppId && APPS.some(app => app.id === linkedAppId)) openModal(linkedAppId);

    Object.assign(window, { sandboxApp, getFiltered, filterByArea, filterByStatus, filterByTag, setView, render, renderCard, updateBadges, openModal, closeModal, handleOverlayClick, showToast });
    }).catch(window.BLK.showError);
  </script>

</body>
</html>
