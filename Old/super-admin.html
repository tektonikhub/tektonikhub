<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title data-blk-text="t1"></title>
  <meta name="description" content="Panel de Super Administrador · Tektonik hub Platform">
  <meta name="theme-color" content="#111111">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,800;1,900&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════
       DESIGN TOKENS
    ══════════════════════════════════════ */
    :root {
      --bg:           #EFEFEB;
      --bg-2:         #E6E6E1;
      --card:         #FFFFFF;
      --fg:           #111111;
      --fg-soft:      #444444;
      --muted:        #777777;
      --line:         #E2E2DE;
      --accent:       #FEFF44;
      --accent-on:    #111111;
      --green:        #0B7A48;
      --green-bg:     #E8F5EE;
      --amber:        #B45309;
      --amber-bg:     #FEF3C7;
      --red:          #B91C1C;
      --red-bg:       #FEE2E2;
      --blue:         #1D4ED8;
      --blue-bg:      #EFF6FF;

      --display-font: 'Barlow', system-ui, -apple-system, sans-serif;
      --body-font:    'DM Sans', system-ui, -apple-system, sans-serif;
      --mono-font:    'JetBrains Mono', monospace;

      --r-card:  18px;
      --r-sm:    10px;
      --sidebar: 260px;
      --topbar:  60px;
      --shadow:  0 18px 40px -20px rgba(0,0,0,.14);
      --shadow-lg: 0 24px 50px -20px rgba(0,0,0,.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; height: 100%; }
    body {
      font-family: var(--body-font);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    img, svg { display: block; }
    button { font-family: var(--body-font); cursor: pointer; }

    .ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .ico-lg { width: 20px; height: 20px; }
    .ico-sm { width: 14px; height: 14px; }

    /* ══════════════════════════════════════
       TOP BAR
    ══════════════════════════════════════ */
    .top-bar {
      height: var(--topbar);
      background: rgba(255,255,255,.97);
      backdrop-filter: saturate(160%) blur(14px);
      -webkit-backdrop-filter: saturate(160%) blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 20px 0 0;
      gap: 12px;
      flex-shrink: 0;
      position: relative;
      z-index: 100;
    }

    .topbar-brand {
      width: var(--sidebar);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-right: 1px solid var(--line);
      height: 100%;
    }

    .brand-logo {
      width: 34px; height: 34px;
      background: #111;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-weight: 900;
      font-size: 15px;
      color: var(--accent);
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .brand-text strong {
      font-family: var(--display-font);
      font-size: 14px;
      font-weight: 800;
    }
    .brand-text span {
      font-family: var(--mono-font);
      font-size: 9px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .02em;
    }

    .super-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #111;
      color: #fff;
      font-family: var(--mono-font);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .08em;
      padding: 3px 8px;
      border-radius: 5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .super-badge span {
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .topbar-center {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
    }

    .console-label {
      font-weight: 700;
      font-size: 14px;
      color: var(--fg-soft);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .tb-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--fg);
      transition: all .15s ease;
      white-space: nowrap;
    }
    .tb-btn:hover { border-color: #111; }
    .tb-btn.primary { background: #111; color: #fff; border-color: transparent; }
    .tb-btn.primary:hover { background: #000; }
    .tb-btn.accent { background: var(--accent); color: #111; border-color: transparent; }
    .tb-btn.accent:hover { filter: brightness(.96); }

    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 9px;
      border: 1.5px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      transition: border-color .15s;
      color: var(--fg-soft);
      position: relative;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: #111; color: var(--fg); }
    .icon-btn .badge-dot {
      position: absolute;
      top: 5px; right: 5px;
      min-width: 16px; height: 16px;
      background: var(--red);
      color: #fff;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      font-family: var(--mono-font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      line-height: 1;
      border: 2px solid #fff;
    }

    .avatar {
      width: 36px; height: 36px;
      background: #111;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
      color: var(--accent);
      font-family: var(--display-font);
      flex-shrink: 0;
      cursor: pointer;
      transition: opacity .15s;
    }
    .avatar:hover { opacity: .85; }

    /* ══════════════════════════════════════
       SHELL
    ══════════════════════════════════════ */
    .shell {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ══════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar);
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 0 20px;
      gap: 0;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    .nav-section-label {
      font-family: var(--mono-font);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 16px 20px 6px;
    }
    .nav-section-label:first-child { padding-top: 4px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--fg-soft);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: background .12s, color .12s;
      border-radius: 0;
      position: relative;
    }
    .nav-item:hover { background: var(--bg); color: var(--fg); }
    .nav-item.active {
      background: var(--bg);
      color: var(--fg);
      font-weight: 700;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px;
      background: #111;
      border-radius: 0 3px 3px 0;
    }
    .nav-item svg { opacity: .6; flex-shrink: 0; }
    .nav-item.active svg, .nav-item:hover svg { opacity: 1; }

    .nav-badge {
      margin-left: auto;
      min-width: 18px;
      height: 18px;
      background: var(--amber-bg);
      color: var(--amber);
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 700;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }
    .nav-badge.red { background: var(--red-bg); color: var(--red); }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 20px 0;
      border-top: 1px solid var(--line);
    }
    .sys-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sys-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    .sys-info-row span:last-child {
      font-family: var(--mono-font);
      color: var(--green);
      font-weight: 700;
    }

    /* ══════════════════════════════════════
       MAIN CONTENT
    ══════════════════════════════════════ */
    .main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    /* panels */
    .panel { display: none; flex-direction: column; gap: 24px; }
    .panel.active { display: flex; }

    /* placeholder */
    .placeholder-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 400px;
      text-align: center;
    }
    .placeholder-panel svg { color: var(--line); }
    .placeholder-panel h3 { font-family: var(--display-font); font-size: 22px; font-weight: 800; color: var(--fg-soft); }
    .placeholder-panel p { font-size: 14px; color: var(--muted); max-width: 300px; }

    /* page header */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .page-title {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .page-title h1 {
      font-family: var(--display-font);
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -.3px;
    }
    .page-title p {
      font-size: 13.5px;
      color: var(--muted);
    }

    /* ══════════════════════════════════════
       KPI CARDS
    ══════════════════════════════════════ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow .15s;
    }
    .kpi-card:hover { box-shadow: var(--shadow); }
    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .kpi-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg-soft);
    }
    .kpi-value {
      font-family: var(--display-font);
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
    }
    .kpi-value.amber { color: var(--amber); }
    .kpi-value.green { color: var(--green); }
    .kpi-sub {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .kpi-sub .trend {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-weight: 700;
      color: var(--green);
    }
    .kpi-sub .trend.down { color: var(--red); }

    /* ══════════════════════════════════════
       CONTENT GRID
    ══════════════════════════════════════ */
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    /* ══════════════════════════════════════
       CARD
    ══════════════════════════════════════ */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      gap: 12px;
    }
    .card-title {
      font-family: var(--display-font);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title svg { color: var(--muted); }

    /* ══════════════════════════════════════
       TABLE
    ══════════════════════════════════════ */
    .tbl-filters {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      height: 34px;
      transition: border-color .15s;
    }
    .search-box:focus-within { border-color: #111; background: #fff; }
    .search-box input {
      border: none;
      background: transparent;
      font-family: var(--body-font);
      font-size: 13px;
      color: var(--fg);
      outline: none;
      width: 180px;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-box svg { color: var(--muted); flex-shrink: 0; }

    .filter-tabs {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 3px;
    }
    .filter-tab {
      padding: 4px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      border: none;
      background: none;
      transition: all .12s;
    }
    .filter-tab.active { background: #fff; color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .filter-tab:hover:not(.active) { color: var(--fg); }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead { background: var(--bg); }
    th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      white-space: nowrap;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: var(--bg); }

    .org-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .org-avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-size: 11px;
      font-weight: 900;
      color: var(--fg-soft);
      flex-shrink: 0;
    }
    .org-name { font-weight: 700; font-size: 13.5px; }
    .org-id { font-family: var(--mono-font); font-size: 10px; color: var(--muted); }

    .plan-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--mono-font);
      letter-spacing: .04em;
    }
    .plan-badge.enterprise { background: #111; color: var(--accent); }
    .plan-badge.pro { background: var(--blue-bg); color: var(--blue); }
    .plan-badge.starter { background: var(--bg); color: var(--fg-soft); border: 1px solid var(--line); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: var(--mono-font);
    }
    .status-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-badge.active { background: var(--green-bg); color: var(--green); }
    .status-badge.active::before { background: var(--green); }
    .status-badge.active-amber { background: var(--amber-bg); color: var(--amber); }
    .status-badge.active-amber::before { background: var(--amber); }
    .status-badge.suspended { background: var(--red-bg); color: var(--red); }
    .status-badge.suspended::before { background: var(--red); }

    .compliance-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bar-track {
      width: 60px;
      height: 5px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--green);
      transition: width .3s ease;
    }
    .bar-fill.amber { background: var(--amber); }
    .bar-fill.red { background: var(--red); }
    .compliance-pct { font-family: var(--mono-font); font-size: 12px; font-weight: 700; }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn {
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--fg);
      transition: all .12s;
      white-space: nowrap;
    }
    .action-btn:hover { border-color: #111; }
    .action-btn.success { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .action-btn.success:hover { background: var(--green); color: #fff; }
    .more-btn {
      width: 30px; height: 30px;
      border-radius: 7px;
      border: 1.5px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      transition: border-color .12s;
      color: var(--fg-soft);
    }
    .more-btn:hover { border-color: #111; }

    /* ══════════════════════════════════════
       MODALS
    ══════════════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 32px 80px -20px rgba(0,0,0,.35);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn .2s cubic-bezier(.34,1.26,.64,1);
    }
    .modal.lg { max-width: 640px; }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.94) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title {
      font-family: var(--display-font);
      font-size: 20px;
      font-weight: 900;
    }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      transition: all .12s;
      color: var(--muted);
    }
    .modal-close:hover { border-color: #111; color: var(--fg); }
    .modal-body { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
    .modal-footer {
      padding: 16px 24px 22px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--line);
    }

    /* form */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 13px; font-weight: 700; }
    .form-input {
      height: 40px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      padding: 0 14px;
      font-family: var(--body-font);
      font-size: 14px;
      color: var(--fg);
      background: #fff;
      outline: none;
      transition: border-color .15s;
      width: 100%;
    }
    .form-input:focus { border-color: #111; }
    .form-input::placeholder { color: var(--muted); }
    select.form-input { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2 4l4 4 4-4' stroke='%23777' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* org detail modal */
    .org-detail-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    .org-detail-avatar {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: #111;
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-size: 16px;
      font-weight: 900;
      color: var(--accent);
      flex-shrink: 0;
    }
    .org-detail-info { flex: 1; }
    .org-detail-info h3 { font-family: var(--display-font); font-size: 20px; font-weight: 900; }
    .org-detail-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .org-detail-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .detail-stat {
      background: var(--bg);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .detail-stat-val {
      font-family: var(--display-font);
      font-size: 24px;
      font-weight: 900;
    }
    .detail-stat-lbl { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }

    .admin-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border-radius: 12px;
      padding: 14px;
    }
    .admin-avatar {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: #111;
      display: grid;
      place-items: center;
      font-family: var(--display-font);
      font-weight: 900;
      font-size: 13px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .admin-info { flex: 1; }
    .admin-name { font-weight: 700; font-size: 14px; }
    .admin-email { font-size: 12px; color: var(--muted); font-family: var(--mono-font); }
    .admin-tag {
      font-size: 10px;
      font-weight: 700;
      font-family: var(--mono-font);
      background: var(--blue-bg);
      color: var(--blue);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }
    .info-row:last-child { border-bottom: none; }
    .info-row span:first-child { color: var(--muted); font-weight: 600; }
    .info-row span:last-child { font-weight: 700; }

    /* ══════════════════════════════════════
       TOAST
    ══════════════════════════════════════ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      color: #fff;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      pointer-events: auto;
      animation: toastIn .25s cubic-bezier(.34,1.26,.64,1);
      max-width: 340px;
    }
    .toast.success svg { color: var(--accent); }
    .toast.error { background: var(--red); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(14px) scale(.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(8px) scale(.95); }
    }

    /* ══════════════════════════════════════
       MISC UTILS
    ══════════════════════════════════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--fg);
      transition: all .15s;
      cursor: pointer;
    }
    .btn:hover { border-color: #111; }
    .btn.primary { background: #111; color: #fff; border-color: transparent; }
    .btn.primary:hover { background: #000; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }
    .btn.accent { background: var(--accent); color: #111; border-color: transparent; }
    .btn.sm { padding: 6px 14px; font-size: 13px; border-radius: 8px; }

    .num { font-family: var(--mono-font); font-weight: 700; }
    .muted { color: var(--muted); }
    .empty-dash { color: var(--line); font-size: 16px; }

    .action-btn.danger { color: var(--red); border-color: var(--red); }
    .status-badge.pending { background: var(--amber-bg); color: var(--amber); }
    .panel .page-header { margin-bottom: 20px; }
    .card-header, .tbl-filters, .action-btns { flex-wrap: wrap; }
    .content-grid > .card { min-width: 0; }
    textarea.form-input { font-family: var(--body-font); }
    @media (max-width: 900px) {
      .sidebar { width: 190px; flex-shrink: 0; }
      .main { padding: 20px 16px 60px; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .console-label { display: none; }
    }
    @media (max-width: 600px) {
      .topbar-brand { width: auto; padding: 0 10px; }
      .brand-text, .super-badge, .topbar-actions .icon-btn { display: none; }
      .sidebar { width: 130px; padding: 12px 6px; }
      .nav-item { font-size: 11px; padding: 9px 6px; gap: 5px; }
      .main { padding: 16px 10px 60px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .kpi-grid, .form-row { grid-template-columns: minmax(0, 1fr); }
      .card-header { padding: 12px; }
      .org-detail-stats { gap: 4px; }
      .modal-footer { flex-wrap: wrap; }
    }

    /* scrollable sidebar ensures content */
    .sidebar { padding-bottom: 24px; }
  </style>
</head>

        <!-- Stats -->

          <div class="detail-stat">
            <div class="detail-stat-val" id="detailMembers"><!--blk:text:t139--></div>
            <div class="detail-stat-lbl"><!--blk:text:t140--></div>
